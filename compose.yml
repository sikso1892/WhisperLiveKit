services:
  wlk:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRAS: ${GPU_EXTRAS:-cu129,qwen3-streaming}
    image: wlk:gpu-qwen3
    container_name: wlk
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${WLK_GPU:-0}']
              capabilities: [gpu]
    ports:
      - "${WLK_PORT:-8000}:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface/hub
    environment:
      - HF_TOKEN
    command:
      - "--backend"
      - "qwen3-vllm-prefix"
      - "--model"
      - "Qwen/Qwen3-ASR-1.7B"
      - "--lan"
      - "${WLK_LANG:-auto}"
      - "--quantization"
      - "fp8"
      - "--gpu-memory-utilization"
      - "0.35"
      - "--pcm-input"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  frpc:
    image: fatedier/frpc:v0.65.0
    container_name: wlk-frpc
    depends_on:
      wlk:
        condition: service_healthy
    env_file:
      - ${ENV_FILE_PATH:-.env}
    volumes:
      - ./frpc/config/frpc.toml:/etc/frp/frpc.toml:z
    command:
      - -c
      - /etc/frp/frpc.toml
    restart: unless-stopped

  wlk-qwen3:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRAS: ${GPU_EXTRAS:-cu129,funasr,sentence_tokenizer}
    image: wlk:gpu-qwen3
    container_name: wlk-qwen3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    ports:
      - "8400:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface/hub
      - modelscope-cache:/root/.cache/modelscope
    environment:
      - HF_TOKEN
    command: ["--backend", "qwen3-streaming", "--model", "Qwen/Qwen3-ASR-0.6B", "--lan", "ko", "--pcm-input", "--unfixed-chunk-num", "6"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    profiles:
      - qwen3

  wlk-nemotron:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRAS: ${GPU_EXTRAS:-cu129,nemotron-streaming}
    image: wlk:gpu-nemotron
    container_name: wlk-nemotron
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    ports:
      - "8200:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface/hub
    environment:
      - HF_TOKEN
    command: ["--backend", "nemotron-streaming", "--nemotron-chunk-mode", "160ms", "--pcm-input"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    profiles:
      - nemotron

  # Multilingual: Qwen3-1.7B FP8 prefix-constrained (ko/zh/en/vi)
  # Language-adaptive UTN/CSS auto-applied per --lan setting
  # Usage: WLK_LANG=ko docker compose --profile multilingual up
  wlk-multilingual:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRAS: ${GPU_EXTRAS:-cu129,funasr,sentence_tokenizer}
    image: wlk:gpu-multilingual
    container_name: wlk-multilingual
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${WLK_GPU:-1}']
              capabilities: [gpu]
    ports:
      - "${WLK_ML_PORT:-8500}:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface/hub
    environment:
      - HF_TOKEN
    command:
      - "--backend"
      - "qwen3-vllm-prefix"
      - "--model"
      - "Qwen/Qwen3-ASR-1.7B"
      - "--lan"
      - "${WLK_LANG:-ko}"
      - "--quantization"
      - "fp8"
      - "--pcm-input"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    profiles:
      - multilingual

  # --- Alternative profiles (use with: docker compose --profile <name> up) ---

  wlk-gpu-voxtral:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRAS: ${GPU_VOXTRAL_EXTRAS:-cu129,voxtral-hf,translation}
    image: wlk:gpu-voxtral
    gpus: all
    ports:
      - "8001:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface/hub
    environment:
      - HF_TOKEN
    command: ["--backend", "voxtral", "--pcm-input"]
    profiles:
      - voxtral

  wlk-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      args:
        EXTRAS: ${CPU_EXTRAS:-cpu,diarization-diart,translation}
    image: wlk:cpu
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface/hub
    environment:
      - HF_TOKEN
    profiles:
      - cpu

volumes:
  hf-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HF_CACHE_DIR:-/mnt/data/.cache/huggingface/hub}
  modelscope-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODELSCOPE_CACHE_DIR:-/mnt/data/.cache/modelscope}
